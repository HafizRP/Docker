version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_server
    restart: unless-stopped
    hostname: rabbitmq
    env_file: .env
    ports:
      - "127.0.0.1:5672:5672"  # RabbiekaltMQ default port
      - "127.0.0.1:15672:15672"  # RabbitMQ Management plugin default port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 60s

volumes:
  rabbitmq_data:
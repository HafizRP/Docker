version: "3.8"

services:
  mariadb10.5:
    image: mariadb:10.5
    container_name: mariadb10.5
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mmbdev
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123456
    ports:
      - "4042:3306" # Map host port 4042 to container port 3306
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - mariadb_network

volumes:
  mariadb_data:

networks:
  mariadb_network:
